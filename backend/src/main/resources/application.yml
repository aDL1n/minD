spring:
  application:
    name: "minD-backend"
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mind}"
    username: "${SPRING_DATASOURCE_USERNAME:mind}"
    password: "${SPRING_DATASOURCE_PASSWORD}"
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

web:
  allowed-frontend-origin: "http://localhost:5173"
